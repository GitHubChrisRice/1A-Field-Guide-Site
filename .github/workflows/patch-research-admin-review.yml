name: Patch research Administrator review UI

on:
  push:
    branches:
      - research-admin-review-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research-admin-review-ui

      - name: Add Administrator research review panel
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, re

          path = Path('docs/member-research.html')
          text = path.read_text(encoding='utf-8')

          panel = '''<section id="admin-review-panel" class="panel" hidden>
          <h2>Administrator review queue</h2>
          <p class="muted">Review submitted member source checks. Starting review is required before approval or rejection. Approval marks the current immutable revision approved for research use; it does not publish anything.</p>
          <div class="actions"><button id="refresh-admin-queue" class="secondary" type="button">Refresh review queue</button></div>
          <div id="admin-queue"></div>
          </section>
          '''
          marker = '<p id="message" role="status" aria-live="polite"></p>'
          if 'id="admin-review-panel"' not in text:
              if marker not in text:
                  raise SystemExit('admin panel insertion point not found')
              text = text.replace(marker, panel + marker, 1)

          text = text.replace('let session=null;', 'let session=null,isAdministrator=false;', 1)

          member_note_old = "    if(row.notes){const notes=document.createElement('p');notes.textContent=row.notes;card.append(notes)}\n    box.append(card);"
          member_note_new = "    if(row.notes){const notes=document.createElement('p');notes.textContent=row.notes;card.append(notes)}\n    if(row.last_review_reason){const review=document.createElement('p');review.className='muted';review.textContent='Review note: '+row.last_review_reason;card.append(review)}\n    box.append(card);"
          if member_note_old in text:
              text = text.replace(member_note_old, member_note_new, 1)
          elif "Review note: "+"'" not in text and 'row.last_review_reason' not in text:
              raise SystemExit('member review-note insertion point not found')

          admin_functions = r'''function adminText(tag,text,className){const el=document.createElement(tag);if(className)el.className=className;el.textContent=text;return el}
          async function runAdminReview(submissionId,reviewAction,reason=''){
            try{
              await req('/functions/v1/manage-research-submissions',{method:'POST',token:session.access_token,body:{action:'admin_review',submission_id:submissionId,review_action:reviewAction,reason}});
              say(reviewAction==='start_review'?'Research submission moved into review.':reviewAction==='approve'?'Research submission approved for research use.':'Research submission rejected.');
              await Promise.all([loadAdminQueue(),loadSubmissions()]);
            }catch(e){say(e?.data?.error||'The research review action could not be completed.')}
          }
          function renderAdminQueue(rows){
            const box=$('admin-queue');box.textContent='';
            if(!rows.length){box.append(adminText('p','No research submissions are waiting for review.','empty'));return}
            for(const row of rows){
              const card=document.createElement('article');card.className='submission';
              card.append(adminText('div',(row.status||'submitted').replaceAll('_',' '),'status'));
              card.append(adminText('h3',row.source_title||row.title||'Source verification'));
              const identity=[row.screen_name||'Member',row.member_code,row.checked_on?'checked '+row.checked_on:null].filter(Boolean).join(' · ');
              card.append(adminText('p',identity,'muted'));
              if(row.source_url){const link=document.createElement('a');link.href=row.source_url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=row.source_url;card.append(link)}
              if(row.notes)card.append(adminText('p',row.notes));
              if(row.last_review_reason)card.append(adminText('p','Latest review note: '+row.last_review_reason,'muted'));
              const actions=document.createElement('div');actions.className='actions';
              if(row.status==='submitted'){
                const start=adminText('button','Start review');start.type='button';start.addEventListener('click',()=>runAdminReview(row.submission_id,'start_review',''));actions.append(start);
              }else if(row.status==='in_review'){
                const label=document.createElement('label');label.className='form';label.append(adminText('span','Decision note'));
                const reason=document.createElement('textarea');reason.maxLength=1000;reason.placeholder='Optional for approval; required for rejection.';label.append(reason);card.append(label);
                const approve=adminText('button','Approve');approve.type='button';approve.addEventListener('click',()=>runAdminReview(row.submission_id,'approve',reason.value.trim()));
                const reject=adminText('button','Reject','secondary');reject.type='button';reject.addEventListener('click',()=>{const value=reason.value.trim();if(!value){say('Enter a rejection reason first.');reason.focus();return}runAdminReview(row.submission_id,'reject',value)});
                actions.append(approve,reject);
              }
              card.append(actions);box.append(card);
            }
          }
          async function loadAdminQueue(){
            if(!isAdministrator)return;
            const box=$('admin-queue');box.textContent='Loading review queue…';
            try{const d=await req('/functions/v1/manage-research-submissions',{method:'POST',token:session.access_token,body:{action:'admin_list'}});renderAdminQueue(d?.submissions||[])}
            catch(e){box.textContent=e?.data?.error||'The research review queue is temporarily unavailable.'}
          }
          '''
          init_marker = 'async function init(){'
          if 'function renderAdminQueue(rows)' not in text:
              if init_marker not in text:
                  raise SystemExit('admin function insertion point not found')
              text = text.replace(init_marker, admin_functions + init_marker, 1)

          init_old = "    $('gate').hidden=true;$('workspace').hidden=false;await loadSubmissions();"
          init_new = "    isAdministrator=roles.includes('administrator');$('admin-review-panel').hidden=!isAdministrator;\n    $('gate').hidden=true;$('workspace').hidden=false;await Promise.all([loadSubmissions(),...(isAdministrator?[loadAdminQueue()]:[])]);"
          if init_old in text:
              text = text.replace(init_old, init_new, 1)
          elif "isAdministrator=roles.includes('administrator')" not in text:
              raise SystemExit('Administrator init insertion point not found')

          listener_old = "$('refresh-submissions').addEventListener('click',loadSubmissions);\nawait init();"
          listener_new = "$('refresh-submissions').addEventListener('click',loadSubmissions);\n$('refresh-admin-queue').addEventListener('click',loadAdminQueue);\nawait init();"
          if listener_old in text:
              text = text.replace(listener_old, listener_new, 1)
          elif "$('refresh-admin-queue').addEventListener" not in text:
              raise SystemExit('admin refresh listener insertion point not found')

          # Keep the inert source page's inline-script CSP hash valid too.
          match = re.search(r'<script type="module">(.*?)</script>', text, re.S)
          if not match:
              raise SystemExit('inline module script not found')
          digest = base64.b64encode(hashlib.sha256(match.group(1).encode()).digest()).decode()
          text, count = re.subn(r"script-src 'sha256-[A-Za-z0-9+/=]+';", f"script-src 'sha256-{digest}';", text, count=1)
          if count != 1:
              raise SystemExit('script CSP hash declaration not found')

          path.write_text(text, encoding='utf-8')

      - name: Commit Administrator review UI
        run: |
          if git diff --quiet -- docs/member-research.html; then
            echo "Administrator research review UI already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+GitHub-Actions@users.noreply.github.com"
          git add docs/member-research.html
          git commit -m "Add Administrator research review panel"
          git push origin HEAD:research-admin-review-ui
