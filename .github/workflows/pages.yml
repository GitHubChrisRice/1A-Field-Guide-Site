name: Build and publish Field Guide site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: field-guide-site-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out public source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: preview/requirements.txt

      - name: Install preview dependencies
        run: python -m pip install -r preview/requirements.txt

      - name: Validate nationwide jurisdiction shell
        run: python tools/jurisdictions/validate_shell.py

      - name: Generate and validate Registry
        run: |
          python tools/registry/validate_restriction_corpus.py
          python tools/registry/build_registry.py
          python tools/registry/build_registry.py --check

      - name: Build MkDocs site
        run: python -m mkdocs build --clean

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out public source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: preview/requirements.txt

      - name: Install preview dependencies
        run: python -m pip install -r preview/requirements.txt

      - name: Build MkDocs site
        run: python -m mkdocs build --clean

      - name: Publish generated site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages:gh-pages

          PUBLISH_DIR="$RUNNER_TEMP/1A-Field-Guide-gh-pages"
          rm -rf "$PUBLISH_DIR"
          git worktree add "$PUBLISH_DIR" gh-pages

          find "$PUBLISH_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site-preview/. "$PUBLISH_DIR/"
          touch "$PUBLISH_DIR/.nojekyll"

          cd "$PUBLISH_DIR"
          git add -A

          if git diff --cached --quiet; then
            echo "Published site is already up to date."
            exit 0
          fi

          git commit -m "Publish Field Guide from ${GITHUB_SHA::7}"
          git push origin gh-pages
