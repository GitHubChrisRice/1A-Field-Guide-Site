name: Patch public records routing

on:
  push:
    branches:
      - fix/public-records-routing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/public-records-routing

      - name: Route generic public records links through neutral start page
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/member-pilot.html')
          text = path.read_text(encoding='utf-8')
          old = '/1A-Field-Guide-Site/california/public-records-evidence-preservation/'
          new = '/1A-Field-Guide-Site/open-government/public-records/'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 California public-records dashboard links, found {count}')
          text = text.replace(old, new)
          text = text.replace('Read the California guide to records requests and evidence preservation.', 'Start with the correct records law for the government that holds the records: federal, state, or local.', 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit routing fix
        run: |
          if git diff --quiet -- docs/member-pilot.html; then
            echo "Public records routing already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+GitHub-Actions@users.noreply.github.com"
          git add docs/member-pilot.html
          git commit -m "Route member public records links through neutral guide"
          git push origin HEAD:fix/public-records-routing
